const sqlQuestions=[
{id:'sq1',topic:'SELECT',points:3,text:'Que renvoie SELECT DISTINCT NOMCAT FROM CATEGORIE ?',options:['Toutes les colonnes de CATEGORIE','Les noms de catégories sans doublons','Les catégories triées par ordre alphabétique','Uniquement la première catégorie'],correct:1,explanation:'DISTINCT retire les doublons parmi les valeurs (ou combinaisons de colonnes) sélectionnées. Il ne trie pas automatiquement le résultat.'},
{id:'sq2',topic:'Filtres',points:3,text:'Quel prédicat convient pour rechercher les noms qui commencent par « Ka » ?',options:["NOM LIKE 'Ka_'","NOM LIKE 'Ka%'","NOM = 'Ka%'","NOM IN ('Ka%')"],correct:1,explanation:'Avec LIKE, % représente zéro ou plusieurs caractères. Le joker _ représente un seul caractère.'},
{id:'sq3',topic:'Filtres',points:3,text:'Quelle expression recherche une valeur absente (NULL) ?',options:['COLONNE = NULL','COLONNE IS NULL','COLONNE IN NULL','COLONNE LIKE NULL'],correct:1,explanation:'NULL exprime une valeur inconnue ou absente : on utilise IS NULL ou IS NOT NULL, pas = NULL.'},
{id:'sq4',topic:'Subtilité',points:3,text:'Quelle affirmation sur BETWEEN est correcte ?',options:['Il exclut toujours les bornes','Il inclut les deux bornes','Il fonctionne uniquement avec des nombres','Il remplace obligatoirement GROUP BY'],correct:1,explanation:'BETWEEN A AND B est inclusif : il équivaut à une comparaison supérieure ou égale à A et inférieure ou égale à B.'},
{id:'sq5',topic:'Alias',points:3,text:'Dans SELECT QTEV * PRIXART AS MONTANT, à quoi sert AS ?',options:['À créer une colonne stockée dans la table','À définir un alias dans le résultat','À appliquer un filtre','À transformer un nombre en texte'],correct:1,explanation:'AS attribue un nom de présentation à une expression ou à une colonne dans le résultat. L’alias ne renomme pas la colonne stockée.'},
{id:'sq6',topic:'Contraintes',points:3,text:'Quelle contrainte identifie chaque ligne et interdit les doublons comme les valeurs NULL ?',options:['CHECK','DEFAULT','PRIMARY KEY','FOREIGN KEY'],correct:2,explanation:'PRIMARY KEY garantit l’unicité et l’absence de NULL pour la clé. Une table ne possède qu’une seule clé primaire, qui peut être composée de plusieurs colonnes.'},
{id:'sq7',topic:'Contraintes',points:3,text:'Que garantit une FOREIGN KEY ?',options:['Que toute valeur est unique dans la table','Que la valeur référencée existe dans la table parent, selon la contrainte','Qu’une colonne possède une valeur par défaut','Que la table est triée'],correct:1,explanation:'Une clé étrangère assure l’intégrité référentielle en reliant une valeur à une clé candidate/unique référencée.'},
{id:'sq8',topic:'DML',points:3,text:'Quel est le principal risque de UPDATE ARTICLE SET PRIXART = 1000; ?',options:['La requête échoue toujours en Oracle','Elle modifie le prix de toutes les lignes','Elle ajoute une nouvelle colonne','Elle ne modifie que la première ligne'],correct:1,explanation:'Sans WHERE, UPDATE applique la nouvelle valeur à toutes les lignes de la table. Vérifie toujours le filtre avant d’exécuter.'},
{id:'sq9',topic:'Agrégation',points:3,text:'Quelle clause filtre les groupes déjà formés par GROUP BY ?',options:['WHERE','HAVING','ORDER BY','DISTINCT'],correct:1,explanation:'WHERE filtre les lignes avant le regroupement ; HAVING filtre les groupes après l’agrégation.'},
{id:'sq10',topic:'Comptage',points:3,text:'Quelle nuance distingue COUNT(*) de COUNT(EMAIL) ?',options:['Aucune, ils ignorent tous deux les NULL','COUNT(*) compte les lignes ; COUNT(EMAIL) ignore les lignes où EMAIL est NULL','COUNT(EMAIL) compte seulement les doublons','COUNT(*) exige un GROUP BY'],correct:1,explanation:'COUNT(*) compte toutes les lignes du groupe. COUNT(expression) ignore les valeurs NULL de l’expression.'},
{id:'sq11',topic:'Jointures',points:3,text:'Tu veux conserver toutes les catégories, même celles sans article. Quelle jointure choisir ?',options:['INNER JOIN','CROSS JOIN','LEFT JOIN de CATEGORIE vers ARTICLE','NATURAL JOIN obligatoirement'],correct:2,explanation:'LEFT JOIN conserve toutes les lignes de la table de gauche. Les colonnes de droite valent NULL quand aucune correspondance n’existe.'},
{id:'sq12',topic:'Jointures',points:3,text:'Pourquoi une jointure peut-elle augmenter le nombre de lignes ?',options:['Parce que JOIN trie les tables','Parce qu’une ligne peut correspondre à plusieurs lignes de l’autre table','Parce que ON supprime les doublons','Parce qu’Oracle répète toujours les colonnes'],correct:1,explanation:'Une relation un-à-plusieurs produit une ligne de résultat par correspondance. Un agrégat après une jointure peut donc compter ou sommer plusieurs occurrences.'},
{id:'sq13',topic:'Oracle',points:3,text:'Quelle écriture convertit explicitement le texte en date Oracle ?',options:["DATE('2026-06-12')","TO_DATE('2026-06-12','YYYY-MM-DD')","CAST_TEXT_TO_DATE('2026-06-12')","CONVERT DATE '2026-06-12'"],correct:1,explanation:'TO_DATE convertit une chaîne suivant un masque. Le masque doit correspondre au format fourni.'},
{id:'sq14',topic:'DDL',points:3,text:'Quelle différence est correcte entre DROP TABLE et DELETE FROM ?',options:['Les deux suppriment toujours uniquement les lignes','DROP TABLE supprime la table ; DELETE supprime des lignes et peut être filtré','DELETE supprime la structure, DROP garde les données','DROP exige obligatoirement WHERE'],correct:1,explanation:'DROP TABLE supprime l’objet table et sa structure. DELETE FROM supprime des lignes ; sans WHERE, toutes les lignes sont ciblées mais la table reste.'},
{id:'sq15',topic:'Oracle',points:3,text:'À quoi sert SELECT * FROM DUAL dans Oracle ?',options:['À supprimer les tables temporaires','À exécuter une expression à partir d’une table système à une ligne','À lister toutes les tables','À créer automatiquement une vue'],correct:1,explanation:'DUAL est une petite table spéciale historiquement utilisée pour exécuter une expression ou une fonction sans table métier.'},
{id:'sq16',topic:'Logique',points:3,text:'Pourquoi parenthéser une condition qui combine AND et OR ?',options:['Pour rendre les noms sensibles à la casse','Pour rendre explicite la priorité logique voulue','Parce que les parenthèses activent DISTINCT','Pour autoriser GROUP BY'],correct:1,explanation:'AND a une priorité supérieure à OR. Les parenthèses évitent qu’une condition soit interprétée différemment de l’intention.'},
{id:'sq17',topic:'Algèbre relationnelle',points:3,text:'En algèbre relationnelle, la sélection σ sert principalement à…',options:['Choisir des colonnes','Filtrer des tuples selon un prédicat','Fusionner des schémas différents','Calculer un produit cartésien'],correct:1,explanation:'La sélection σ filtre les lignes/tuples. La projection π choisit les attributs/colonnes.'},
{id:'sq18',topic:'Algèbre relationnelle',points:3,text:'Quelles conditions sont nécessaires pour UNION dans le modèle relationnel ?',options:['Même nom de table','Schémas compatibles : même nombre d’attributs et types compatibles','Une clé étrangère commune','Toujours exactement les mêmes tuples'],correct:1,explanation:'L’union exige des relations compatibles. Elle combine les tuples et, en algèbre ensembliste, les doublons sont éliminés.'},
{id:'sq19',topic:'Normalisation',points:3,text:'Une relation est en 2NF quand…',options:['Elle possède obligatoirement trois clés étrangères','Elle est en 1NF et aucun attribut non-clé ne dépend d’une partie seulement d’une clé candidate composée','Elle ne contient jamais de NULL','Toutes les tables ont exactement deux colonnes'],correct:1,explanation:'La 2NF élimine les dépendances partielles des attributs non premiers envers une partie d’une clé candidate composée.'},
{id:'sq20',topic:'Normalisation',points:3,text:'Une dépendance transitive est au cœur de quel objectif ?',options:['1NF','2NF uniquement','3NF','CROSS JOIN'],correct:2,explanation:'La 3NF vise notamment à éliminer les dépendances transitives inappropriées entre attributs non-clés, en partant d’une relation déjà en 2NF.'}
];
const businessChapters=[
{id:'b1',n:'01',icon:'◉',title:'Le système entreprise',summary:'Définition, formes, ressources, valeur ajoutée et finalités.',body:`<p>Le support définit la <strong>gestion d’entreprise</strong> comme l’identification des actions qui confortent la stratégie, le pilotage de leur mise en œuvre opérationnelle et le contrôle des résultats. Gérer, ce n’est donc pas simplement donner des ordres : il faut planifier les décisions à partir de faits et de chiffres, utiliser les ressources de manière optimale, coordonner les métiers et soutenir le développement de l’entreprise.</p>
<h2>1. Ce qu’est une entreprise</h2><p>Une entreprise est une communauté humaine qui produit des richesses, avec une culture et une histoire. Elle peut naître, se développer, traverser des crises, réussir, être rachetée ou cesser ses activités. La création d’entreprise correspond à la mise en œuvre d’une nouvelle combinaison de facteurs de production — travail, capital, matières — pour former une nouvelle unité légale.</p>
<h2>2. Classer les entreprises</h2><p>Le support retient trois critères. <strong>La taille</strong> s’apprécie notamment à partir du chiffre d’affaires et de l’effectif : PME ou grande entreprise. <strong>Le statut juridique</strong> distingue notamment les entreprises privées (entreprise individuelle, EURL, SNC, SARL, SA) et les entreprises publiques. <strong>L’activité</strong> distingue les entreprises agricoles, industrielles, prestataires de services et commerciales. Le chiffre d’affaires est le total des ventes réalisées pendant une période ; il n’est pas le bénéfice.</p>
<h2>3. Les ressources et les opérations</h2><p>L’entreprise combine des ressources humaines, financières et techniques. Elle achète auprès de fournisseurs, organise les tâches en départements reliés par des communications, puis vend des biens ou services à ses clients. La production transforme des <strong>intrants</strong> (inputs : matières, énergie, travail, capital, informations) en <strong>extrants</strong> (outputs : biens ou services produits).</p>
<h2>4. Valeur ajoutée : formule incontournable</h2><p>La valeur ajoutée mesure la richesse créée : <strong>VA = Production (P) − Consommation intermédiaire (CI)</strong>. La consommation intermédiaire comprend les matières, fournitures, énergie et services achetés qui sont consommés pour produire. Exemple du support : une boulangerie vend du pain pour 1 000 et a consommé 600 de farine, d’eau et d’énergie ; VA = 1 000 − 600 = 400. Dans le support, la main-d’œuvre est distinguée de la consommation intermédiaire.</p>
<h2>5. Répartition et finalités</h2><p>Les ventes produisent des flux financiers qui doivent permettre de rémunérer les facteurs de production, de payer les charges sociales et fiscales et de dégager un surplus pour l’avenir. La valeur ajoutée se répartit entre le personnel, l’État, les collectivités, les prêteurs et les propriétaires. Les finalités économiques consistent à créer de la valeur, dégager un profit et assurer la <strong>pérennité</strong> de l’entreprise.</p>
<h2>6. Rentabilité et rendement : ne pas confondre</h2><p>Dans le support, la <strong>rentabilité</strong> est financière : c’est le rapport d’un résultat aux capitaux investis. Le <strong>rendement</strong> est physique : il rapporte la production obtenue aux moyens mis en œuvre. Une hausse de la production par travailleur illustre le rendement ; la comparaison d’un résultat avec les capitaux investis illustre la rentabilité.</p>
<h2>7. Les difficultés possibles</h2><p>La mévente, une mauvaise perception de l’évolution du marché, les erreurs de gestion et l’insuffisance de ressources financières peuvent menacer la survie. Le gestionnaire doit observer les coûts, les goûts des consommateurs, les concurrents, les technologies et la motivation du personnel, plutôt que réagir seulement quand les difficultés deviennent graves.</p>
<div class="callout"><div>✦</div><div><strong>À retenir</strong><br>Chiffre d’affaires ≠ bénéfice ; rendement ≠ rentabilité ; valeur ajoutée = production − consommation intermédiaire.</div></div>`,questions:[
{id:'b1q1',topic:'Valeur ajoutée',points:4,text:'Une entreprise réalise une production de 1 000 et consomme 600 de biens et services intermédiaires. Quelle est sa valeur ajoutée selon le support ?',options:['1 600','600','400','400 %'],correct:2,explanation:'VA = Production − Consommation intermédiaire = 1 000 − 600 = 400. Ce n’est ni le chiffre d’affaires seul ni le bénéfice net.'},
{id:'b1q2',topic:'Indicateurs',points:4,text:'Quel exemple correspond à la rentabilité plutôt qu’au rendement ?',options:['Rapporter les unités produites aux heures de travail','Rapporter le résultat obtenu aux capitaux investis','Compter les employés','Additionner le nombre de commandes'],correct:1,explanation:'La rentabilité est un rapport financier résultat/capitaux investis. Le rendement est un rapport physique entre production et moyens mis en œuvre.'},
{id:'b1q3',topic:'Ressources',points:4,text:'Dans le vocabulaire du cours, les matières, l’énergie et les informations utilisées pour produire sont des…',options:['Extrants uniquement','Intrants ou inputs','Dividendes','Capitaux propres'],correct:1,explanation:'Les intrants sont les éléments qui entrent dans le processus de production ; les extrants sont les biens ou services qui en sortent.'},
{id:'b1q4',topic:'Finalités',points:4,text:'Quel est le sens de la pérennité d’une entreprise ?',options:['Sa capacité à durer dans le temps','Son chiffre d’affaires d’une seule journée','Le nombre de départements','La disparition de ses dettes uniquement'],correct:0,explanation:'La pérennité signifie la capacité à durer. La rentabilité et une bonne gestion contribuent à cette continuité.'}]},
{id:'b2',n:'02',icon:'⌘',title:'Organisation et structure',summary:'Fonctions de l’entreprise, structures de Fayol, relations humaines et rémunération.',body:`<p>À mesure qu’une entreprise grandit, les tâches deviennent plus nombreuses et variées. L’organisation répond aux questions : <strong>qui fait quoi, avec qui et dans quel but ?</strong> Une fonction est un groupement de tâches, pas nécessairement un groupement de postes : une même personne peut réaliser des tâches relevant de fonctions différentes. La structure répartit les tâches, les pouvoirs, les responsabilités, les flux d’information et les mécanismes de coordination.</p>
<h2>1. Les fonctions selon Henri Fayol</h2><p>Le support distingue six fonctions : <strong>technique</strong> (production, fabrication, transformation) ; <strong>commerciale</strong> (achats, ventes, échanges) ; <strong>financière</strong> (recherche et gestion des capitaux) ; <strong>de sécurité</strong> (protection des biens et des personnes) ; <strong>de comptabilité</strong> (inventaires, bilan, prix de revient, statistiques) ; et <strong>administrative</strong> (prévoir, organiser, commander, coordonner, contrôler). Le cours formule aussi des critiques : Fayol accorde une place importante à la comptabilité, regroupe les achats et ventes dans le commercial, et n’isole pas suffisamment la fonction personnel.</p>
<h2>2. Les fonctions selon Bernard Exgrafoff</h2><p>Le support regroupe les activités en quatre fonctions : <strong>direction</strong> (s’informer, décider, faire comprendre, faire pouvoir, faire vouloir) ; <strong>distribution</strong> (étude commerciale, vente, publicité) ; <strong>production</strong> (fabrication et contrôle de qualité) ; et <strong>logistique</strong> (approvisionnement, équipement, maintenance, gestion du personnel et des finances, recherche-développement, administration générale). Ces classifications ne sont pas strictement identiques : il faut savoir rattacher une tâche à la classification demandée dans la question.</p>
<h2>3. Les trois structures présentées dans le cours</h2><p><strong>Structure hiérarchique linéaire :</strong> chaque agent n’a qu’un seul chef. Elle rend l’autorité et les responsabilités claires, mais peut produire des silos, de la rigidité, une circulation lente des informations et une dépendance à des chefs devant maîtriser de nombreux sujets.</p><p><strong>Structure fonctionnelle :</strong> elle s’appuie sur des spécialistes. Elle renforce les compétences techniques mais rompt l’unité de commandement : un agent peut recevoir des directives de plusieurs spécialistes. Ne confonds donc pas « structure fonctionnelle » et « hiérarchie à chef unique ».</p><p><strong>Structure hiérarchico-fonctionnelle :</strong> elle conserve une ligne hiérarchique et y ajoute des états-majors de spécialistes chargés d’éclairer les décisions. Elle combine unité de commandement et expertise, mais peut entraîner des tensions entre opérationnels et fonctionnels.</p>
<h2>4. Relations humaines et ressources humaines</h2><p>La politique des relations humaines vise à améliorer les relations entre exécutants, encadrement et direction. Elle prend en compte les personnes, les groupes de travail et la communauté sociale, et s’appuie notamment sur l’évaluation et le dialogue social. La gestion des ressources humaines cherche à concilier le développement des personnes avec les contraintes et objectifs de l’entreprise.</p>
<h2>5. Rémunération et motivation</h2><p>Pour les travailleurs, la rémunération doit permettre de couvrir les besoins personnels et familiaux, offrir une certaine sécurité, être équitable au regard des qualifications et avoir un mode de calcul compréhensible. Pour l’entreprise, elle doit soutenir la productivité, la qualité, la sécurité et un climat social cohérent. Salaires au rendement et primes de productivité illustrent le lien possible entre rémunération et résultats, sans effacer les besoins d’équité et de sécurité.</p>
<div class="callout"><div>✦</div><div><strong>Piège d’examen</strong><br>Linéaire = un seul chef ; fonctionnelle = intervention de spécialistes et risque de plusieurs ordres ; hiérarchico-fonctionnelle = ligne hiérarchique + état-major de spécialistes.</div></div>`,questions:[
{id:'b2q1',topic:'Fayol',points:4,text:'Chez Fayol, « prévoir, organiser, commander, coordonner, contrôler » correspond à la fonction…',options:['Technique','Administrative','De sécurité','Commerciale'],correct:1,explanation:'Ce sont les activités de la fonction administrative dans la classification présentée par le support.'},
{id:'b2q2',topic:'Structure linéaire',points:4,text:'Quel principe caractérise la structure hiérarchique linéaire ?',options:['Un agent reçoit les ordres de plusieurs experts','Aucun responsable n’est identifié','Un agent n’a qu’un seul chef','La direction est remplacée par des comités sans hiérarchie'],correct:2,explanation:'La structure linéaire repose sur l’unité de commandement : une seule ligne hiérarchique.'},
{id:'b2q3',topic:'Structure fonctionnelle',points:4,text:'Quel inconvénient le support associe-t-il à la structure fonctionnelle ?',options:['L’interdiction d’utiliser des spécialistes','La rupture de l’unité de commandement','L’impossibilité de produire','L’absence de toute compétence spécialisée'],correct:1,explanation:'Des spécialistes peuvent donner des directives dans leur domaine ; un agent peut donc relever de plusieurs autorités fonctionnelles.'},
{id:'b2q4',topic:'Rémunération',points:4,text:'Lequel n’est PAS présenté comme un besoin du travailleur en matière de rémunération ?',options:['Équité','Clarté du mode de calcul','Sécurité du paiement','Maximiser la publicité du produit'],correct:3,explanation:'Le cours cite couverture des besoins, sécurité, équité et clarté. La publicité appartient aux activités commerciales, pas aux besoins de rémunération.'}]},
{id:'b3',n:'03',icon:'↗',title:'Activités commerciales',summary:'Mercatique, offre et demande, comportement du consommateur, produit, prix, distribution et communication.',body:`<p>La <strong>mercatique</strong> (marketing) regroupe les actions qui permettent de détecter, prévoir ou constater les besoins des consommateurs, puis d’adapter de façon continue la production et la commercialisation. La démarche consiste à étudier le marché, définir le produit ou service, fixer un prix, choisir les canaux de distribution, communiquer et vendre.</p>
<h2>1. Comprendre le marché</h2><p>Le support distingue l’<strong>offre</strong> — qualité et quantité du bien, prix, concurrence — et la <strong>demande</strong> — revenu des consommateurs, besoins et comportements d’achat. L’entreprise étudie les acheteurs, consommateurs, prescripteurs, concurrents, distributeurs et leaders d’opinion. Pour analyser les consommateurs, elle demande : que consomme-t-on, comment et pourquoi ?</p>
<h2>2. Besoin, motivation et comportement d’achat</h2><p>Le <strong>besoin</strong> est un sentiment de privation lié aux exigences de la nature ou de la vie sociale. La <strong>motivation</strong> est l’état de tension qui pousse une personne à agir pour réduire cette privation. Les deux notions se complètent : le besoin exprime un état, la motivation pousse à l’action. Le cours souligne aussi que l’achat peut exprimer une identité, dépendre de la valeur symbolique d’une marque ou susciter des regrets parce que choisir un bien revient à renoncer à un autre.</p>
<h2>3. Le marchéage : les quatre variables</h2><p>La politique commerciale combine quatre variables appelées <strong>mix</strong> ou marchéage : <strong>produit</strong>, <strong>prix</strong>, <strong>distribution</strong> et <strong>communication</strong>. Le produit est un bien ou service répondant à des besoins. Son cycle de vie comprend le <strong>lancement</strong> (ventes faibles et dépenses initiales importantes), la <strong>croissance</strong> (les ventes augmentent et les bénéfices apparaissent), la <strong>maturité</strong> (ventes stabilisées) et le <strong>déclin</strong> (les ventes diminuent sous l’effet d’offres mieux adaptées). Il faut anticiper le remplacement des produits en déclin.</p>
<h2>4. Part de marché relative</h2><p>Le support donne la formule : <strong>Part de marché relative = part de marché de l’entreprise ÷ part de marché du concurrent principal</strong>. Un ratio supérieur à 1 indique que l’entreprise est leader sur le marché, selon cet indicateur.</p>
<h2>5. Prix et distribution</h2><p>Le prix dépend des objectifs de l’entreprise, des contraintes juridiques et de la concurrence. Pour la distribution, le cours distingue le <strong>canal long</strong> (au moins deux intermédiaires, par exemple grossiste puis détaillant), le <strong>canal court</strong> (un intermédiaire, souvent le détaillant) et le <strong>canal ultra-court</strong> (vente directe, sans intermédiaire). Le support écrit le taux de rendement du circuit comme : <strong>R = (Chiffre d’affaires − Coût de distribution) ÷ Coût de production</strong>.</p>
<h2>6. Communication commerciale</h2><p>La communication transmet un message d’un émetteur à un récepteur. Elle vise à informer, développer une bonne image de marque et influencer le comportement de l’acheteur potentiel. La publicité est une forme courante, complétée par la promotion, le parrainage et d’autres techniques.</p>
<div class="callout"><div>✦</div><div><strong>À retenir</strong><br>4P = produit, prix, distribution, communication. Cycle de vie = lancement, croissance, maturité, déclin. Canal long = au moins deux intermédiaires ; ultra-court = aucun.</div></div>`,questions:[
{id:'b3q1',topic:'Besoin et motivation',points:4,text:'Selon le support, quelle distinction entre besoin et motivation est correcte ?',options:['Le besoin est une action ; la motivation est un état de privation','Le besoin exprime un état ; la motivation pousse à agir','Les deux mots désignent toujours exactement la même chose','La motivation ne joue aucun rôle dans l’achat'],correct:1,explanation:'Le support indique : le besoin exprime un état de privation ; la motivation est la tension qui conduit à agir pour le satisfaire.'},
{id:'b3q2',topic:'Cycle de vie',points:4,text:'À quelle phase les ventes se stabilisent-elles parce que la clientèle potentielle est largement touchée ?',options:['Lancement','Croissance','Maturité','Déclin'],correct:2,explanation:'À la maturité, les ventes se stabilisent ; l’outil de production est déjà constitué. Au déclin, les ventes diminuent.'},
{id:'b3q3',topic:'Distribution',points:4,text:'Un fabricant vend directement au consommateur, sans intermédiaire. Quel canal utilise-t-il ?',options:['Canal long','Canal court','Canal ultra-court','Canal à deux grossistes'],correct:2,explanation:'Le canal ultra-court ne comporte aucun intermédiaire : le producteur vend directement au consommateur.'},
{id:'b3q4',topic:'Marché',points:4,text:'La part de marché relative d’une entreprise vaut 1,25. Que peut-on conclure selon le critère du cours ?',options:['L’entreprise est leader par rapport au concurrent principal','L’entreprise n’a aucune vente','Le prix est nécessairement trop élevé','Le produit est nécessairement en déclin'],correct:0,explanation:'Un ratio supérieur à 1 signifie que la part de marché de l’entreprise dépasse celle de son concurrent principal.'}]},
{id:'b4',n:'04',icon:'▤',title:'Financement de l’entreprise',summary:'Investissement, exploitation, capital, CAF, FR, BFE, trésorerie et rentabilité.',body:`<p>Les besoins de financement apparaissent notamment parce que l’entreprise doit payer certaines dépenses avant d’encaisser les recettes de ses ventes. Le support distingue deux grands besoins : financer les <strong>investissements</strong> et financer le <strong>cycle d’exploitation</strong>. La durée du financement doit correspondre à la durée du besoin : le support formule la règle « durée de disponibilité du financement > durée de vie de l’investissement ».</p>
<h2>1. Besoins d’investissement et besoins d’exploitation</h2><p>Les investissements peuvent être <strong>matériels/corporels</strong> (terrains, locaux, équipements), <strong>incorporels</strong> (connaissances, compétences, innovation, adaptation) ou <strong>financiers</strong> (participations dans d’autres sociétés pour se diversifier, sécuriser des approvisionnements ou développer des synergies). Le cycle d’exploitation mobilise notamment les stocks et les créances clients. Les disponibilités de trésorerie peuvent être mobilisées rapidement, tandis que stocks et créances constituent souvent un besoin permanent.</p>
<h2>2. Les ressources</h2><p>Les <strong>ressources stables</strong> comprennent les capitaux propres et les emprunts durables. Les <strong>dettes d’exploitation</strong>, principalement les crédits fournisseurs, se renouvellent avec le cycle courant. Les <strong>dettes de trésorerie</strong>, comme un découvert bancaire, sont temporaires et instables. Le capital social correspond aux apports des associés ; dans une société anonyme, ils prennent la forme d’actions, tandis que d’autres formes de sociétés utilisent des parts sociales.</p>
<h2>3. CAF et autofinancement</h2><p>La <strong>capacité d’autofinancement (CAF)</strong> mesure le potentiel interne de financement. Le support la présente comme la différence entre les produits encaissables et les charges décaissables. L’<strong>autofinancement = CAF − dividendes</strong>. Les dividendes sont la part du bénéfice distribuée aux associés. La partie conservée peut servir à financer des investissements, rembourser des emprunts ou améliorer la trésorerie.</p>
<h2>4. Bilan, fonds de roulement et BFE</h2><p>Le bilan oppose l’<strong>actif</strong> (emplois : biens et créances) au <strong>passif</strong> (ressources : capitaux propres et dettes). Le <strong>fonds de roulement (FR) = ressources stables − immobilisations brutes</strong>. Le <strong>besoin de financement d’exploitation (BFE) = actif d’exploitation − passif/dettes d’exploitation</strong>. Le FR est une ressource stable ; le BFE est un besoin de financement permanent du cycle d’exploitation.</p>
<h2>5. Trésorerie nette</h2><p>La formule fondamentale du support est <strong>Trésorerie nette = FR − BFE</strong>. Si FR &gt; BFE, la trésorerie nette est positive. Si FR &lt; BFE, elle est négative et l’entreprise peut devoir recourir à des financements bancaires à court terme. Exemple : FR = 500 et BFE = 350 donnent une trésorerie nette de 150 ; FR = 200 et BFE = 350 donnent −150.</p>
<h2>6. Rentabilité et effet de levier</h2><p>Le <strong>taux de rentabilité = résultat obtenu ÷ capitaux investis</strong>. Le support distingue la <strong>rentabilité économique = résultat d’exploitation (ou EBE) ÷ capitaux investis</strong>, et la <strong>rentabilité financière = résultat net (ou courant) ÷ capitaux propres</strong>. L’endettement améliore la rentabilité des capitaux propres seulement si la marge supplémentaire obtenue grâce à l’emprunt dépasse les intérêts versés : c’est l’<strong>effet de levier</strong>. Si les intérêts dépassent cette marge supplémentaire, l’effet réduit la rentabilité.</p>
<div class="callout"><div>✦</div><div><strong>Les trois formules à savoir écrire sans hésiter</strong><br>FR = ressources stables − immobilisations brutes.<br>BFE = actif d’exploitation − passif d’exploitation.<br>Trésorerie nette = FR − BFE.</div></div>`,questions:[
{id:'b4q1',topic:'BFE',points:4,text:'L’actif d’exploitation vaut 900 et les dettes d’exploitation valent 550. Quel est le BFE ?',options:['1 450','350','550','−350'],correct:1,explanation:'BFE = actif d’exploitation − dettes/passif d’exploitation = 900 − 550 = 350.'},
{id:'b4q2',topic:'Trésorerie',points:4,text:'Le FR est de 500 et le BFE de 350. Quelle est la trésorerie nette ?',options:['−150','850','150','350'],correct:2,explanation:'Trésorerie nette = FR − BFE = 500 − 350 = 150. Un résultat positif signifie que le FR couvre le BFE.'},
{id:'b4q3',topic:'Autofinancement',points:4,text:'La CAF vaut 800 et les dividendes distribués valent 200. Quel est l’autofinancement ?',options:['1 000','600','200','800'],correct:1,explanation:'Autofinancement = CAF − dividendes = 800 − 200 = 600.'},
{id:'b4q4',topic:'Effet de levier',points:4,text:'Quand l’endettement peut-il accroître la rentabilité des capitaux propres selon le cours ?',options:['Toujours, quel que soit le taux','Quand la marge supplémentaire dépasse les intérêts versés','Quand l’entreprise n’a aucune vente','Quand les intérêts dépassent la marge supplémentaire'],correct:1,explanation:'L’effet de levier est favorable si le supplément de marge obtenu grâce à l’emprunt est supérieur aux intérêts payés.'}]},
{id:'b5',n:'05',icon:'＋',title:'Création de l’entreprise',summary:'Profil du promoteur, idée, opportunité, faisabilité et plan d’affaires.',body:`<p>La création d’entreprise est une démarche volontaire qui comporte des risques et exige une préparation. Le support insiste sur la qualité des personnes et des relations humaines, ainsi que sur la nécessité d’offrir des produits ou services de qualité. Avant de lancer un projet, le promoteur doit analyser ses capacités, ses points faibles, les opportunités du marché et la cohérence entre son profil et l’idée envisagée.</p>
<h2>1. Les grandes étapes</h2><p>Le support propose une progression : <strong>1)</strong> chercher une bonne idée de création ; <strong>2)</strong> vérifier que cette idée constitue réellement une opportunité exploitable ; <strong>3)</strong> transformer l’opportunité en une entreprise viable, en maximisant son potentiel de rentabilité et de croissance. Le créateur vérifie ensuite la cohérence au moyen d’une étude de faisabilité, lance les opérations, démarre l’activité et cherche à atteindre la vitesse de croisière, c’est-à-dire le rythme normal de fonctionnement.</p>
<h2>2. Profil de l’initiateur</h2><p>L’entrepreneur ne doit pas être confondu avec le chef d’entreprise envisagé uniquement comme administrateur-gestionnaire. Dans le support, l’entrepreneur est un chef d’entreprise qui possède les compétences et la motivation nécessaires pour créer une activité économique, entrer dans un secteur et potentiellement créer des emplois. Il doit connaître ses forces et faiblesses et évaluer l’adéquation de son profil avec le projet.</p>
<h2>3. Idée ou opportunité commerciale</h2><p>Une opportunité répond à un besoin qui n’est pas satisfait ou l’est mal. Le produit ou le service doit pouvoir être vendu à un prix acceptable pour les clients tout en restant rentable pour la future entreprise. Une idée intéressante en soi n’est donc pas encore une opportunité viable : il faut examiner la demande, les concurrents, les moyens nécessaires et les conditions économiques.</p>
<h2>4. Le plan d’affaires (business plan)</h2><p>Le plan d’affaires reflète l’entreprise et ses possibilités d’évolution. Il fixe les objectifs et précise les moyens pour les atteindre. Il sert à étudier en profondeur un projet et à démontrer sa faisabilité, à donner aux banques et associés des bases de décision et à présenter les projets commerciaux de manière claire. Il doit rendre cohérents le marché visé, l’offre, l’organisation, les moyens et les chiffres prévisionnels.</p>
<h2>5. Pertinence, efficacité et efficience</h2><p>Le support présente trois éléments du contrôle de gestion : <strong>pertinence</strong> = choisir le bon objectif ; <strong>efficacité</strong> = atteindre l’objectif ; <strong>efficience</strong> = l’atteindre au moindre coût. Ces notions sont proches mais distinctes : un résultat peut être atteint (efficacité) tout en consommant beaucoup trop de ressources (faible efficience) ; un objectif peut aussi être bien exécuté mais mal choisi (manque de pertinence).</p>
<div class="callout"><div>✦</div><div><strong>Méthode de révision</strong><br>Idée → opportunité vérifiée → entreprise viable → étude de faisabilité → lancement → vitesse de croisière. Le business plan explicite objectifs, moyens et faisabilité.</div></div>`,questions:[
{id:'b5q1',topic:'Création',points:4,text:'Quelle succession correspond à la démarche présentée dans le support ?',options:['Créer immédiatement, puis chercher une idée','Chercher une idée, vérifier l’opportunité, bâtir une entreprise viable','Rédiger une publicité, puis arrêter l’étude du marché','Emprunter, puis décider ce qui sera vendu'],correct:1,explanation:'Le support commence par l’idée, vérifie ensuite l’opportunité et vise enfin une entreprise viable, au moyen d’une étude de faisabilité.'},
{id:'b5q2',topic:'Opportunité',points:4,text:'Une idée devient une opportunité commerciale lorsque…',options:['Elle plaît uniquement au promoteur','Elle répond à un besoin insuffisamment satisfait et peut être rentable à un prix acceptable','Elle exige toujours un grand emprunt','Elle n’a aucun concurrent'],correct:1,explanation:'Le cours met en avant le besoin non ou mal satisfait, un prix acceptable pour le client et une rentabilité possible pour l’entreprise.'},
{id:'b5q3',topic:'Business plan',points:4,text:'Quel est un rôle central du plan d’affaires ?',options:['Garantir que le projet ne connaîtra aucun risque','Démontrer la faisabilité et éclairer les décisions des partenaires','Remplacer tout contrôle des résultats','Se limiter au nom de l’entreprise'],correct:1,explanation:'Le plan d’affaires approfondit l’idée, démontre la faisabilité, présente les objectifs et moyens et aide banques/associés à décider.'},
{id:'b5q4',topic:'Contrôle de gestion',points:4,text:'Atteindre un objectif en consommant le moins de ressources possible correspond à…',options:['La pertinence','L’efficience','L’inefficacité','La segmentation'],correct:1,explanation:'Dans le triangle du cours, la pertinence choisit le bon objectif, l’efficacité l’atteint et l’efficience l’atteint au moindre coût.'}]}
];
const sqlLessons=[
{id:'smodel',n:'01',title:'Relation, schéma, tuple et clés',summary:'Le vocabulaire qui évite de confondre table, ligne, colonne et identifiant.',body:`<p>Une base relationnelle organise les données dans des <strong>relations</strong>, que l’on représente souvent sous forme de tables. Le <strong>schéma</strong> décrit la structure : nom de relation, attributs, domaines ou types, contraintes. Un <strong>tuple</strong> est une occurrence de la relation — une ligne concrète. Un attribut correspond à une colonne. Deux tables peuvent partager un attribut pour exprimer une relation.</p><div class="example-grid"><div class="example"><b>Schéma</b><span>ARTICLE(NUMART, NOMART, PRIXART)</span></div><div class="example"><b>Attribut</b><span>NOMART est une colonne</span></div><div class="example"><b>Tuple</b><span>ARTA01, Eau en bouteille, 12000</span></div></div><p>Une <strong>clé primaire</strong> identifie chaque tuple sans doublon et sans NULL. Une clé candidate est un ensemble minimal d’attributs qui identifie les tuples ; on en choisit une comme clé primaire. Une <strong>clé étrangère</strong> relie des lignes de tables différentes. Par exemple, ARTICLE.CODECAT peut référencer CATEGORIE.CODECAT et VENTE.NUMART peut référencer ARTICLE.NUMART.</p><h2>Types et valeurs</h2><p>En Oracle, on rencontre notamment <code>CHAR(n)</code> pour une chaîne de longueur fixe, <code>VARCHAR2(n)</code> pour une chaîne variable, <code>NUMBER(p,s)</code> pour un nombre de précision p et d’échelle s, et <code>DATE</code> pour les dates et heures. Choisis un type compatible avec les valeurs et les opérations attendues. Un identifiant avec des zéros initiaux est souvent une chaîne plutôt qu’un nombre à calculer.</p><h2>Intégrité</h2><p>Les contraintes protègent la qualité des données : <code>NOT NULL</code> rend une valeur obligatoire, <code>UNIQUE</code> interdit les doublons sur l’ensemble concerné, <code>CHECK</code> impose une condition, <code>DEFAULT</code> fournit une valeur en cas d’omission et <code>FOREIGN KEY</code> garantit l’intégrité référentielle. La clé primaire combine unicité et non-nullité.</p>`},
{id:'sddl',n:'02',title:'Créer et modifier une table',summary:'CREATE TABLE, ALTER TABLE, types de données et contraintes.',body:`<p>Le langage de définition des données (LDD/DDL) sert à créer et modifier les structures. <code>CREATE TABLE</code> définit la table et ses colonnes. Il est généralement préférable de nommer les contraintes afin de pouvoir les retrouver et les faire évoluer clairement.</p><h2>Créer une table</h2><p>On indique les colonnes, leur type, puis les contraintes. Une clé étrangère doit référencer une clé primaire ou une contrainte unique compatible. Lors de l’insertion, respecte les types, les règles d’intégrité et l’existence préalable de la ligne référencée.</p><h2>Modifier une structure</h2><p><code>ALTER TABLE … ADD</code> ajoute une colonne ou une contrainte ; <code>MODIFY</code> modifie certaines propriétés ; <code>DROP COLUMN</code> supprime une colonne ; <code>DROP CONSTRAINT</code> supprime une contrainte. Une opération échoue si les données existantes ne respectent pas une nouvelle contrainte, ou si une colonne est encore utilisée par une dépendance.</p><h2>Contraintes à bien distinguer</h2><ul><li><strong>PRIMARY KEY</strong> : identifiant sans doublon et non NULL.</li><li><strong>FOREIGN KEY</strong> : valeur qui doit correspondre à une clé référencée (sauf NULL si autorisé).</li><li><strong>UNIQUE</strong> : empêche les doublons sur une colonne ou combinaison ; son interaction avec NULL suit les règles du SGBD.</li><li><strong>CHECK</strong> : chaque valeur non NULL doit satisfaire le prédicat.</li><li><strong>DEFAULT</strong> : utilisée quand la colonne est omise ou que DEFAULT est demandé, pas quand on fournit explicitement NULL.</li><li><strong>NOT NULL</strong> : interdit l’absence de valeur.</li></ul><h2>Suppression : attention irréversible</h2><p><code>DROP TABLE</code> supprime l’objet table. <code>TRUNCATE TABLE</code> vide toutes les lignes sans supprimer la structure ; Oracle le traite comme une instruction DDL avec ses règles de validation implicite. <code>DELETE</code> supprime des lignes et permet un filtre WHERE ; sans filtre, toutes les lignes sont visées. Avant une suppression, vérifie le contexte et l’effet attendu.</p>`},
{id:'sselect',n:'03',title:'SELECT et filtres',summary:'DISTINCT, AS, WHERE, LIKE, IN, BETWEEN, NULL et ORDER BY.',body:`<p><code>SELECT</code> permet d’extraire des colonnes ou de calculer des expressions depuis une ou plusieurs tables. La forme générale est : SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY. Les dernières clauses sont optionnelles, selon la question à résoudre.</p><h2>Choisir les colonnes</h2><p><code>SELECT *</code> demande toutes les colonnes. Pour une requête lisible, indique les attributs nécessaires. <code>DISTINCT</code> enlève les doublons sur l’ensemble des expressions sélectionnées : si deux noms sont identiques mais les codes diffèrent et que le code est aussi sélectionné, les lignes restent différentes. <code>AS</code> ajoute un alias d’affichage ; il ne change pas le nom persistant de l’attribut.</p><h2>Filtrer correctement</h2><p><code>WHERE</code> retient les lignes avant le regroupement. Utilise <code>=</code>, <code>&lt;&gt;</code>, <code>&gt;</code>, <code>&gt;=</code>, etc. <code>IN</code> teste l’appartenance à une liste. <code>BETWEEN a AND b</code> inclut les deux bornes. <code>LIKE</code> utilise les jokers <code>%</code> (zéro ou plusieurs caractères) et <code>_</code> (un caractère). Les chaînes sont entourées d’apostrophes simples.</p><h2>Les pièges de NULL</h2><p>Une comparaison avec NULL ne renvoie pas vrai ou faux comme on l’attendrait ; le résultat logique est inconnu. Utilise <code>IS NULL</code> ou <code>IS NOT NULL</code>. Ne confonds pas valeur nulle et chaîne vide. En Oracle, une chaîne de longueur zéro est traitée comme NULL dans les situations SQL concernées.</p><h2>Trier le résultat</h2><p><code>ORDER BY</code> est la dernière clause dans l’ordre syntaxique d’un SELECT. <code>ASC</code> trie par ordre croissant (valeur par défaut) et <code>DESC</code> par ordre décroissant. Sans ORDER BY, l’ordre des lignes n’est pas garanti.</p>`},
{id:'sjoin',n:'04',title:'Jointures et agrégations',summary:'INNER / LEFT JOIN, COUNT, SUM, GROUP BY et HAVING.',body:`<p>Une jointure met en relation des lignes provenant de plusieurs tables. Dans une jointure explicite, <code>JOIN</code> introduit la table et <code>ON</code> exprime les colonnes de correspondance. Sans condition de jointure correcte, un produit cartésien ou un résultat multiplié peut apparaître.</p><h2>Quelle jointure ?</h2><p><strong>INNER JOIN</strong> conserve les correspondances satisfaisant la condition. <strong>LEFT JOIN</strong> conserve toutes les lignes de gauche et complète avec NULL lorsque la droite ne correspond pas. <strong>CROSS JOIN</strong> produit toutes les combinaisons. La jointure naturelle (NATURAL JOIN) déduit automatiquement la correspondance à partir des colonnes de même nom : elle peut être concise, mais devient fragile si le schéma évolue ou partage des noms non destinés à être joints.</p><h2>Fonctions d’agrégation</h2><p><code>COUNT(*)</code> compte les lignes ; <code>COUNT(colonne)</code> compte les valeurs non NULL de la colonne. <code>SUM</code>, <code>AVG</code>, <code>MIN</code> et <code>MAX</code> calculent respectivement somme, moyenne, minimum et maximum sur les valeurs pertinentes. Pour compter les articles par catégorie, un LEFT JOIN permet de garder même les catégories sans article ; compte une colonne de l’autre table, par exemple COUNT(a.NUMART), pour que l’absence de correspondance donne zéro.</p><h2>GROUP BY ou HAVING ?</h2><p><code>GROUP BY</code> construit les groupes selon les attributs demandés. Toute expression sélectionnée qui n’est pas agrégée doit être compatible avec le groupement. <code>HAVING</code> filtre les groupes après calcul des agrégats. Exemple : <code>WHERE DATEV &gt;= ...</code> restreint les ventes avant le calcul ; <code>HAVING SUM(QTEV) &gt; 20</code> retient les magasins dont le total est supérieur à 20.</p><h2>Éviter les sommes gonflées</h2><p>Avant une agrégation, vérifie la cardinalité : un enregistrement de vente relié à plusieurs lignes de détail peut se répéter. Ne corrige pas un mauvais JOIN en ajoutant aveuglément DISTINCT ; définis d’abord le niveau de détail, les clés de jointure et les colonnes sur lesquelles grouper.</p>`},
{id:'salg',n:'05',title:'Algèbre relationnelle',summary:'Sélection, projection, union, différence, produit, jointure et intersection.',body:`<p>L’algèbre relationnelle est une collection d’opérations formelles appliquées à des relations et produisant des relations. Elle aide à raisonner sur les requêtes avant de les écrire en SQL. Une relation est ici considérée comme un ensemble de tuples, alors que les résultats SQL peuvent conserver des doublons sauf demande contraire.</p><h2>Sélection σ et projection π</h2><p>La <strong>sélection</strong> σ filtre les tuples selon un prédicat : « articles dont le prix dépasse 1000 ». Équivalent SQL : WHERE. La <strong>projection</strong> π choisit les attributs : « afficher uniquement le nom et le prix ». Équivalent SQL : SELECT colonnes ; en algèbre ensembliste, les doublons résultants sont éliminés.</p><h2>Opérations ensemblistes</h2><p><strong>Union</strong> (R ∪ S) rassemble les tuples des deux relations compatibles. <strong>Différence</strong> (R − S) conserve les tuples de R absents de S ; l’ordre importe, car R − S n’est pas nécessairement S − R. <strong>Intersection</strong> garde les tuples communs. Ces opérations nécessitent des schémas compatibles (même nombre d’attributs et domaines/types correspondants). En SQL, on rencontre UNION, MINUS sous Oracle, et INTERSECT.</p><h2>Produit cartésien et jointure</h2><p>Le <strong>produit cartésien</strong> R × S combine chaque tuple de R avec chaque tuple de S : si R compte m lignes et S n lignes, le produit compte m × n lignes. La <strong>jointure</strong> sélectionne dans ces combinaisons celles qui satisfont une condition. Elle lie ainsi, par exemple, ARTICLE et CATEGORIE via CODECAT.</p><h2>La division</h2><p>La division relationnelle sert à exprimer une condition « pour tous » : trouver les étudiants qui ont suivi tous les cours d’un ensemble, ou les fournisseurs qui fournissent toutes les pièces demandées. Elle n’a pas un opérateur SQL unique universel : on la construit souvent avec NOT EXISTS imbriqué, agrégats ou différences selon les hypothèses.</p><h2>Traduire une question</h2><p>Identifie d’abord les lignes qui doivent être conservées (sélection), les colonnes demandées (projection), les relations à combiner (jointure), puis les calculs ou regroupements. Dans une recherche commerciale, il faut identifier les relations à combiner, les attributs de liaison, les filtres à appliquer, puis les colonnes attendues ; DISTINCT élimine les répétitions SQL éventuelles.</p>`},
{id:'snorm',n:'06',title:'Dépendances et normalisation',summary:'Anomalies, dépendances fonctionnelles et 1NF, 2NF, 3NF.',body:`<p>La normalisation vise à représenter les données en relations qui respectent des critères d’intégrité et évitent des anomalies. Une relation mal structurée peut répéter la même information dans de nombreuses lignes, ce qui complique les mises à jour et favorise les incohérences.</p><h2>Les anomalies</h2><p>Une anomalie de mise à jour apparaît lorsqu’un même fait doit être modifié à plusieurs endroits et que l’une des copies reste inchangée. Une anomalie d’insertion survient lorsqu’on ne peut pas enregistrer un fait sans en inventer un autre. Une anomalie de suppression survient lorsqu’effacer une ligne fait perdre une information qui devrait rester disponible.</p><h2>Dépendance fonctionnelle</h2><p>On note <strong>A → B</strong> quand une valeur d’A détermine une seule valeur de B dans le contexte étudié. Par exemple, si chaque code catégorie correspond à un nom unique, CODECAT → NOMCAT. La dépendance doit refléter la règle métier réelle, pas seulement un hasard observé dans un petit échantillon.</p><h2>1NF : des valeurs atomiques</h2><p>Chaque cellule doit contenir une valeur unique dans le domaine défini, sans liste répétée de valeurs dans une seule colonne. Des groupes répétitifs ou listes séparées par des virgules rendent filtrage et contraintes difficiles. Une première forme normale ne garantit pas encore l’absence de toutes les redondances.</p><h2>2NF : supprimer les dépendances partielles</h2><p>Une relation est en 2NF si elle est en 1NF et si chaque attribut non-clé dépend de la clé candidate entière, pas d’une simple partie d’une clé composée. Si la clé de LIGNE_COMMANDE est (NUMCOMMANDE, NUMPRODUIT), alors le nom du produit dépend de NUMPRODUIT seulement : il doit être stocké dans PRODUIT plutôt que répété dans chaque ligne de commande.</p><h2>3NF : supprimer les dépendances transitives inappropriées</h2><p>Une relation en 3NF est déjà en 2NF et ne doit pas contenir de dépendance transitive indésirable d’une clé vers un attribut non-clé via un autre attribut non-clé. Si CODEETUDIANT détermine CODEFILIERE et CODEFILIERE détermine NOMFILIERE, conserver NOMFILIERE dans chaque ligne étudiant répète un fait sur la filière ; une table FILIERE séparée est généralement préférable.</p><div class="callout"><div>✦</div><div><strong>Méthode</strong><br>Repère les clés candidates, écris les dépendances fonctionnelles, cherche les dépendances partielles, puis transitives. Normaliser ne signifie pas « multiplier les tables au hasard » : il faut préserver les dépendances importantes et pouvoir reconstituer les informations par jointure.</div></div>`}
];

// Leçon DML ajoutée pour relier les commandes de manipulation aux projets.
sqlLessons.splice(2,0,{id:'sdml',n:'03',title:'Insérer, modifier et supprimer des données',summary:'INSERT, INSERT ALL, UPDATE, DELETE, COMMIT et ROLLBACK.',body:`<p>Le langage de manipulation des données (<strong>DML</strong>) agit sur le contenu des tables. Il ne faut pas le confondre avec le DDL, qui définit ou modifie la structure. Dans une question d’examen, demande-toi d’abord si l’action porte sur la structure (colonne, contrainte, table) ou sur les lignes stockées.</p><h2>INSERT : ajouter une ligne</h2><p><code>INSERT INTO</code> ajoute une occurrence. Indiquer explicitement les colonnes est une bonne habitude : l’ordre des valeurs correspond alors à la liste donnée, et le code résiste mieux à l’évolution de la table. Oracle permet aussi <code>INSERT ALL</code> pour effectuer plusieurs insertions dans un même script. Les clés étrangères exigent que la ligne référencée existe déjà.</p><h2>UPDATE : modifier les lignes ciblées</h2><p><code>UPDATE table SET colonne = valeur WHERE condition</code> modifie toutes les lignes qui satisfont la condition. La plus grande erreur de débutant consiste à omettre <code>WHERE</code> : sans filtre, toutes les lignes reçoivent la modification. Avant de mettre à jour, exécute souvent un <code>SELECT</code> avec le même filtre pour vérifier quelles lignes seront concernées.</p><h2>DELETE : retirer des lignes</h2><p><code>DELETE FROM table WHERE condition</code> supprime les lignes qui satisfont la condition ; sans <code>WHERE</code>, toutes les lignes sont ciblées, mais la structure de la table reste. <code>TRUNCATE TABLE</code> vide la table ; <code>DROP TABLE</code> supprime la structure elle-même. Ces opérations ne sont donc pas interchangeables.</p><h2>COMMIT et ROLLBACK</h2><p><code>COMMIT</code> valide les modifications transactionnelles en attente ; <code>ROLLBACK</code> annule les modifications non validées de la transaction. Attention, en Oracle les instructions DDL telles que <code>CREATE</code>, <code>ALTER</code> et <code>DROP</code> provoquent des validations implicites : ne compte pas sur <code>ROLLBACK</code> pour annuler un changement de structure déjà exécuté.</p><div class="callout"><div>✦</div><div><strong>Avant UPDATE ou DELETE</strong><br>1) Tester la condition dans un SELECT ; 2) vérifier les identifiants ; 3) appliquer l’instruction ; 4) contrôler le résultat avec SELECT. Une clé composite exige de considérer l’ensemble de ses colonnes.</div></div>`});
sqlLessons.forEach((lesson,index)=>{lesson.n=String(index+1).padStart(2,'0')});
sqlLessons.find(l=>l.id==='sddl').body += `<h2>Écrire ADD CONSTRAINT explicitement</h2><p>La contrainte peut être intégrée au CREATE TABLE ou ajoutée ensuite. L’écriture <code>ADD CONSTRAINT</code> est utile lorsqu’une table existe déjà ou lorsqu’on souhaite nommer la règle clairement.</p><pre class="sql-example">ALTER TABLE DEPARTEMENT
ADD CONSTRAINT PK_DEPARTEMENT PRIMARY KEY (CODEDEP);

ALTER TABLE ARTICLE
ADD CONSTRAINT FK_ARTICLE_CAT
FOREIGN KEY (CODECAT) REFERENCES CATEGORIE(CODECAT);

ALTER TABLE VENTE
ADD CONSTRAINT CK_VENTE_QTE CHECK (QTEV BETWEEN 0 AND 9999);

ALTER TABLE MAGASIN
ADD CONSTRAINT UQ_NOMMAG UNIQUE (NOMMAG);</pre><p>Avant d’ajouter une clé primaire, vérifie que la table n’a pas déjà de clé primaire et que les valeurs sont uniques et non nulles. Pour une clé étrangère, toutes les valeurs non NULL doivent correspondre à la clé référencée. Une contrainte peut échouer si les données existantes enfreignent la règle.</p>`;
sqlLessons.find(l=>l.id==='salg').body += `<h2>Autres opérations du support</h2><p><strong>Intersection (R ∩ S)</strong> conserve les tuples présents dans les deux relations. <strong>Complément</strong> : relativement à un univers U défini, il conserve les tuples de U qui ne sont pas dans R. Ces opérations exigent que le contexte et les relations compatibles soient clairement définis.</p><p><strong>Jointure externe</strong> : contrairement à une jointure interne, elle peut conserver des tuples sans correspondance en complétant les attributs manquants par NULL. En SQL, <code>LEFT OUTER JOIN</code> conserve tout le côté gauche, <code>RIGHT OUTER JOIN</code> tout le côté droit et <code>FULL OUTER JOIN</code> les deux côtés.</p><p><strong>Semi-jointure</strong> : renvoie les tuples de R qui participent à une jointure avec S, en conservant les attributs de R. On peut souvent exprimer le test de participation en SQL avec <code>EXISTS</code>. <strong>Jointure naturelle</strong> : rapproche automatiquement sur les attributs de même nom ; elle évite de répéter l’attribut de correspondance mais peut être fragile si le schéma évolue.</p>`;
sqlLessons.find(l=>l.id==='sjoin').body += `<h2>Jointure et clé étrangère : deux choses différentes</h2><p>Une <strong>clé étrangère</strong> est une contrainte de stockage qui contrôle la validité des références. Une <strong>jointure</strong> est une opération de requête qui combine les lignes pour présenter des informations ensemble. On peut écrire une jointure même si aucune contrainte FK n’a été déclarée, mais la contrainte et la jointure ne jouent pas le même rôle.</p><h2>Le détail à préserver</h2><p>Avant d’utiliser <code>SUM</code> ou <code>COUNT</code>, annonce-toi le niveau du résultat : par vente, par magasin, par article, ou par couple magasin-article. Chaque colonne descriptive non agrégée doit être compatible avec <code>GROUP BY</code>. Une jointure plusieurs-à-plusieurs peut dupliquer les lignes et gonfler les sommes.</p>`;

function countCompleted(){
  const completed = new Set();
  Object.keys(state.completedTasks||{}).forEach(k=>{if(state.completedTasks[k])completed.add(k)});
  Object.keys(state.earnedMcq||{}).forEach(k=>{if(state.earnedMcq[k])completed.add(k)});
  Object.keys(state.seenLessons||{}).forEach(k=>{if(state.seenLessons[k])completed.add(k)});
  return completed.size;

function copyCode(id){
  const value=document.getElementById(id)?.textContent||'';
  if(navigator.clipboard && window.isSecureContext){navigator.clipboard.writeText(value).then(()=>showToast('Code copié.')).catch(()=>fallbackCopy(value));}
  else fallbackCopy(value);
}
function fallbackCopy(value){const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('Code copié.');}catch(e){showToast('Sélectionne le code pour le copier.');}ta.remove();}
function resetProgress(){if(!confirm('Réinitialiser tous les points et toutes les activités validées sur cet appareil ?'))return;state=defaultState();saveState();renderHome();setActiveNav('home');showToast('Progression réinitialisée.');window.scrollTo({top:0,behavior:'smooth'});}
function markLesson(id,course){const key='lesson:'+course+':'+id;if(!state.seenLessons[key]){state.seenLessons[key]=true;state.points+=5;saveState();showToast('Leçon marquée comme étudiée : +5 points.');}else showToast('Cette leçon est déjà validée.');const btn=document.querySelector(`[data-lesson-mark="${key}"]`);if(btn){btn.textContent='✓ Leçon étudiée';btn.disabled=true;btn.classList.add('is-done');}updateScore();}
function questionCard(q,course){
  const chosen=state.mcqAnswers[q.id];
  const earned=!!state.earnedMcq[q.id];
  const show=chosen!==undefined && chosen!==null;
  const correct=show && Number(chosen)===q.correct;
  return `<article class="question-card" id="question-${q.id}"><div class="question-meta"><span>${esc(q.topic||'Révision')}</span><span>${q.points} points</span></div><h3>${esc(q.text)}</h3><div class="answer-grid">${q.options.map((option,i)=>{let cls='answer-option';if(show&&i===Number(chosen))cls+=' chosen';if(show&&i===q.correct)cls+=' correct';if(show&&i===Number(chosen)&&i!==q.correct)cls+=' incorrect';return `<button type="button" class="${cls}" onclick="answerMCQ('${q.id}',${i},'${course}')" aria-pressed="${show&&i===Number(chosen)?'true':'false'}"><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${esc(option)}</span></button>`}).join('')}</div>${show?`<div class="question-feedback ${correct?'good':'bad'}" role="status"><strong>${correct?'Bonne réponse.':`Réponse à revoir. La bonne réponse est ${String.fromCharCode(65+q.correct)}.`}</strong> ${earned&&!correct?'Les points obtenus lors de la validation initiale restent acquis. ':''}${esc(q.explanation)} ${correct&&!earned?`+${q.points} points.`:correct?'Réponse déjà validée.':''}</div>`:`<div class="small-muted">Choisis une réponse pour recevoir une explication.</div>`}</article>`;
}
function findQuestion(id){return [...relationalQuestions,...relationalAssertions,...sqlQuestions].find(q=>q.id===id)||businessChapters.flatMap(c=>c.questions).find(q=>q.id===id);}
function answerMCQ(id,choice,course){
  const q=findQuestion(id);if(!q)return;
  state.mcqAnswers[id]=choice;
  if(Number(choice)===q.correct&&!state.earnedMcq[id]){state.earnedMcq[id]=true;state.points+=q.points;}
  saveState();
  const old=document.getElementById('question-'+id);
  if(old){const wrapper=document.createElement('div');wrapper.innerHTML=questionCard(q,course);old.replaceWith(wrapper.firstElementChild);}
  updateScore();
}

    <a href="#assertions-relationnelles" data-rail="assertions-relationnelles"><span class="rail-num">02</span><span class="rail-text">Assertions oui/non</span></a>
    <a href="#sql-notions" data-rail="sql-notions"><span class="rail-num">03</span><span class="rail-text">Leçons SQL</span></a>

   </nav></div>

 } else {

function renderSQL(activeLesson='smodel'){
 setActiveNav('sql');
 const active=sqlLessons.find(l=>l.id===activeLesson)||sqlLessons[0];
 const allRel=[...relationalQuestions,...relationalAssertions];
 document.getElementById('app').innerHTML=`${pageIntro('PARCOURS BASES DE DONNÉES','Comprendre les données. Raisonner avec précision.','Maîtrise les opérations de l’algèbre relationnelle, les assertions et les notions SQL à travers des questions à choix multiples.',`${state.points}`,'points gagnés')}
 <section class="section-anchor" id="algebre-relationnelle"><div class="subsection-head"><div><div class="kicker">PARTIE 1 · RAISONNEMENT</div><h2>Algèbre relationnelle</h2></div><p>${relationalQuestions.length} QCM détaillés · sélection, projection, jointures, opérations ensemblistes, division et subtilités.</p></div><div class="pill-row"><span>σ Sélection</span><span>π Projection</span><span>⋈ Jointure</span><span>∪ ∩ −</span><span>Cardinalités</span></div>${relationalQuestions.map(q=>questionCard(q,'sql')).join('')}</section>
 <section class="section-anchor" id="assertions-relationnelles"><div class="subsection-head"><div><div class="kicker">VRAI OU FAUX</div><h2>Assertions : réponds par oui ou non</h2></div><p>${relationalAssertions.length} assertions avec des pièges de raisonnement. La correction apparaît après ton choix.</p></div>${relationalAssertions.map(q=>questionCard(q,'sql')).join('')}</section>
 <section class="section-anchor" id="sql-notions"><div class="subsection-head"><div><div class="kicker">RAPPELS DE COURS</div><h2>Les notions SQL à maîtriser</h2></div><p>Exemples Oracle consultables pour revoir la syntaxe ; aucune saisie de code n’est demandée.</p></div><div class="lesson-layout" id="lesson-focus">${lessonBody(active,'sql')}${lessonSidebar(sqlLessons,active.id,'sql')}</div></section>
 <section class="section-anchor" id="sql-qcm-fondamentaux"><div class="subsection-head"><div><div class="kicker">QUESTIONS TRANSVERSALES</div><h2>Subtilités et fondamentaux</h2></div><p>${sqlQuestions.length} QCM supplémentaires sur les contraintes, les fonctions, Oracle, la normalisation et les pièges de logique.</p></div>${sqlQuestions.map(q=>questionCard(q,'sql')).join('')}</section>
 <section class="section-anchor" id="glossaire"><div class="subsection-head"><div><div class="kicker">MÉMO RAPIDE</div><h2>Glossaire</h2></div><p>Retrouve rapidement une commande ou un concept.</p></div><div class="glossary-tools"><input class="search-input" type="search" id="glossary-search" placeholder="Rechercher une notion…" oninput="filterGlossary(this.value)"><span class="small-muted">${glossary.length} fiches</span></div><div class="glossary-grid" id="glossary-grid">${glossary.map((g,i)=>glossaryCard(g,i)).join('')}</div></section>`;
 mountLearningLayout('sql',activeLesson);updateScore();
}
function glossaryCard(g,i){return `<article class="glossary-item" data-glossary="${esc((g.term+' '+g.desc+' '+g.syntax).toLowerCase())}"><h3>${esc(g.term)}</h3><p>${esc(g.desc)}</p><pre>${esc(g.syntax)}</pre><div style="margin-top:8px"><button class="text-link" type="button" onclick="copyCode('glossary-code-${i}')">Copier la syntaxe ↗</button><pre id="glossary-code-${i}" hidden>${esc(g.syntax)}</pre></div></article>`;}
function filterGlossary(value){const query=value.toLowerCase().trim();document.querySelectorAll('[data-glossary]').forEach(item=>{item.hidden=!item.dataset.glossary.includes(query)});}
function renderBusiness(activeChapter='b1'){
 setActiveNav('business');

 const chapters=businessChapters.map(c=>{const key='lesson:business:'+c.id;const done=!!state.seenLessons[key];return `<article class="chapter-card section-anchor" id="chapter-${c.id}"><div class="chapter-icon">${c.icon}</div><div class="chapter-content"><div class="question-meta"><span>CHAPITRE ${c.n}</span><span>${c.questions.reduce((s,q)=>s+q.points,0)} points</span></div><h2>${esc(c.title)}</h2><p class="chapter-summary">${esc(c.summary)}</p><div class="lesson-body">${c.body}</div><div class="chapter-state"><button class="primary-btn" type="button" data-lesson-mark="${key}" onclick="markLesson('${c.id}','business')" ${done?'disabled':''}>${done?'✓ Chapitre étudié':'Marquer le chapitre étudié · +5 pts'}</button><span class="small-muted">${c.questions.length} QCM · corrections commentées</span></div><hr class="section-divider"><h3>Questions de maîtrise — chapitre ${c.n}</h3>${c.questions.map(q=>questionCard(q,'business')).join('')}</div></article>`}).join('');
 document.getElementById('app').innerHTML=`${pageIntro('PARCOURS GESTION','Comprendre l’entreprise, du système au projet.','Cinq chapitres construits autour du support : explications développées, formules à connaître, distinctions fines et QCM corrigés après chaque leçon.',`${state.points}`,'points gagnés')}<div class="pill-row"><span>5 chapitres</span><span>20 QCM</span><span>Calculs de gestion</span><span>Questions de distinction</span></div><div class="callout"><div>✦</div><div><strong>Conseil de révision</strong><br>Lis chaque chapitre avant de répondre aux QCM situés à sa fin. Pour les formules, refais le calcul sans regarder l’explication puis vérifie ta réponse.</div></div>${chapters}`;
 mountLearningLayout('business',activeChapter);
 updateScore();
}
