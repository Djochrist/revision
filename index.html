/* Interface de parcours et de niveaux. */
:root{
 --ink:#1f2328;--ink2:#32383f;--paper:#ffffff;--white:#fff;--muted:#656d76;--line:#d1d9e0;
 --lime:#dbeafe;--lime2:#0969da;--coral:#bf3989;--blue:#0969da;--soft:#f6f8fa;
 --green:#1a7f37;--red:#cf222e;--radius:8px;--shadow:0 1px 2px rgba(31,35,40,.06)
}
html{scroll-padding-top:86px}
body{background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55}
button,input,textarea{font-family:inherit}
pre,code,textarea{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #0969da;outline-offset:2px}
.shell{width:min(1320px,calc(100% - 48px))}
.topbar{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid #d1d9e0}
.topbar-inner{min-height:66px;gap:24px}
.brand{font-size:1rem;letter-spacing:-.02em;gap:10px;text-align:left;white-space:nowrap}
.brand-mark{width:34px;height:34px;border-radius:7px;background:#1f2328;color:#fff;transform:none;font-size:1.18rem;font-weight:800;letter-spacing:-.06em}
.brand-wording{display:flex;flex-direction:column;line-height:1.12;gap:4px}
.brand-period{color:#0969da}
.brand-wording small{font-size:.62rem;letter-spacing:.08em;font-weight:750;color:#656d76}
.nav{align-self:stretch;gap:4px}
.nav button,.quiet-btn{align-self:stretch;border-radius:0;padding:0 13px;font-size:.875rem;font-weight:600;color:#656d76;border-bottom:2px solid transparent}
.nav button:hover{background:#f6f8fa;color:#1f2328}
.nav button.active{background:transparent;color:#1f2328;border-bottom-color:#0969da}
.score-pill{background:#f6f8fa;color:#1f2328;border:1px solid #d1d9e0;border-radius:6px;padding:7px 11px;font-size:.82rem;font-weight:700}
.score-star{color:#0969da}
.page{padding:28px 0 56px;min-height:calc(100vh - 138px)}
.hero{grid-template-columns:minmax(0,1.6fr) minmax(260px,.8fr);gap:16px}
.hero-main{background:#0d1117;border:1px solid #0d1117;border-radius:8px;padding:clamp(26px,4vw,44px);min-height:310px}
.hero .eyebrow{color:#79c0ff}
.eyebrow{letter-spacing:.055em;font-size:.72rem;color:#656d76}
.eyebrow-dot{background:#2f81f7;width:8px;height:8px}
.hero h1{font-size:clamp(2.1rem,4vw,3.35rem);line-height:1.08;letter-spacing:-.035em;margin:16px 0 14px}
.hero h1 em{color:#79c0ff}
.hero p{font-size:1rem;color:#c9d1d9;line-height:1.6;margin-bottom:22px}
.hero-art{right:-30px;bottom:-95px;width:240px;height:240px;border-color:rgba(121,192,255,.23);opacity:.65}
.hero-art:before,.hero-art:after{border-color:rgba(121,192,255,.19)}
.hero-art span{width:94px;height:94px;background:#0969da;color:white;border-radius:8px;transform:none;font-size:2.15rem;letter-spacing:-.04em;box-shadow:none}
.progress-card{background:#f6f8fa;border:1px solid #d1d9e0;border-radius:8px;padding:22px;min-height:310px}
.progress-card h2{font-size:1.2rem;letter-spacing:-.02em}
.progress-card p{color:#656d76}
.progress-ring{width:112px;height:112px;background:conic-gradient(#0969da var(--progress,0%),#d8dee4 0);margin:13px auto}
.progress-ring:before{inset:7px;background:#f6f8fa}
.progress-ring strong{font-size:1.75rem;letter-spacing:-.02em}
.progress-ring small{letter-spacing:0;color:#656d76}
.stat-row{gap:8px}
.stat{border:1px solid #d1d9e0;border-radius:6px;background:#fff;padding:10px 12px}
.stat strong{font-size:1.2rem;letter-spacing:-.02em}
.stat span{color:#656d76;font-size:.69rem;letter-spacing:.02em}
.section-head{margin:34px 0 16px;align-items:flex-end}
.section-head h2{font-size:1.5rem;letter-spacing:-.025em}
.section-head p{font-size:.9rem;color:#656d76}
.course-grid{gap:14px}
.course-card{border:1px solid #d1d9e0;border-radius:8px;padding:22px;min-height:270px;box-shadow:none;transition:border-color .15s,box-shadow .15s}
.course-card:hover{transform:none;border-color:#0969da;box-shadow:0 1px 5px rgba(31,35,40,.08)}
.course-icon{width:42px;height:42px;border-radius:7px;background:#ddf4ff;font-size:1.2rem}
.course-card.business .course-icon{background:#fff1e5}
.label{border:1px solid #d1d9e0;border-radius:5px;background:#f6f8fa;color:#656d76;padding:4px 8px;font-size:.7rem}
.course-card h3{font-size:1.35rem;letter-spacing:-.025em;margin:18px 0 7px}
.course-card p{font-size:.92rem;line-height:1.6}
.course-footer{padding-top:20px}
.course-meta{font-size:.76rem;gap:10px}
.arrow-btn{width:34px;height:34px;border-radius:6px;background:#0969da;font-size:1rem}
.arrow-btn:hover{background:#0550ae}
.feature-strip{gap:16px}
.feature{border-top:1px solid #d1d9e0;padding:15px 2px;gap:10px}
.feature b{font-size:.88rem}
.feature span{font-size:.78rem}
.feature-icon{width:32px;height:32px;border-radius:6px;background:#f6f8fa}
.page-intro{background:#0d1117;border:1px solid #0d1117;border-radius:8px;padding:clamp(22px,3.3vw,34px);margin-bottom:18px;align-items:flex-start}
.page-intro h1{font-size:clamp(1.85rem,3vw,2.65rem);line-height:1.15;letter-spacing:-.035em;margin:8px 0 9px}
.page-intro p{font-size:.96rem;line-height:1.65;color:#c9d1d9}
.page-intro .eyebrow{color:#79c0ff}
.intro-side{min-width:100px;text-align:right;border-left:1px solid #30363d;padding-left:20px}
.intro-side strong{font-size:1.6rem;letter-spacing:-.02em}
.intro-side span{color:#c9d1d9}
.kicker,.module-number{letter-spacing:.06em;font-size:.69rem;font-weight:750;color:#656d76}
.module-grid{gap:12px}
.module-card{border:1px solid #d1d9e0;border-radius:7px;padding:18px;min-height:190px}
.module-card.featured{background:#f6f8fa;border-color:#d1d9e0}
.module-card h3{font-size:1.06rem;letter-spacing:-.015em}
.module-card p{font-size:.88rem;line-height:1.6}
.primary-btn,.secondary-btn,.ghost-btn{border-radius:6px;padding:8px 13px;font-size:.86rem;font-weight:650;transition:background .12s,border-color .12s}
.primary-btn{background:#1f883d;color:#fff;border:1px solid rgba(31,35,40,.15)}
.primary-btn:hover{background:#1a7f37;transform:none}
.primary-btn:disabled{background:#f6f8fa;border-color:#d1d9e0;color:#656d76;cursor:default}
.secondary-btn{background:#0969da;color:#fff}
.secondary-btn:hover{background:#0550ae}
.ghost-btn{background:#fff;border:1px solid #d1d9e0;color:#1f2328}
.ghost-btn:hover{background:#f6f8fa}
.text-link{color:#0969da;font-weight:650}
.callout{border-radius:6px;background:#ddf4ff;border:1px solid #b6e3ff;border-left:4px solid #0969da;color:#1f2328;padding:13px 15px;font-size:.9rem}
.callout strong{color:#1f2328}
.code-box{background:#0d1117;border:1px solid #30363d;border-radius:7px;margin:12px 0 18px}
.code-head{background:#161b22;border-bottom:1px solid #30363d;color:#c9d1d9;padding:9px 12px;font-size:.75rem}
.code-head button{border-radius:5px;border-color:#484f58;font-weight:600;padding:5px 8px}
.code-box pre{padding:14px 16px;font-size:.81rem;line-height:1.6}
.step-grid{gap:10px}
.step{border:1px solid #d1d9e0;border-radius:7px;padding:15px}
.step-num{background:#ddf4ff;color:#0969da;border-radius:6px;width:28px;height:28px}
.step h3{font-size:.92rem}
.step p{font-size:.84rem;line-height:1.55}
.task-list{gap:10px}
.task-card{border:1px solid #d1d9e0;border-radius:7px}
.task-card:target{border-color:#0969da;box-shadow:0 0 0 2px rgba(9,105,218,.12)}
.task-head{grid-template-columns:38px 1fr auto;padding:14px 16px;gap:11px}
.task-index{width:34px;height:34px;border:1px solid #d1d9e0;border-radius:6px;background:#f6f8fa;font-size:.84rem}
.task-title h3{font-size:.98rem;letter-spacing:-.015em}
.task-title p{font-size:.82rem;line-height:1.5}
.points{border:1px solid #d1d9e0;border-radius:5px;background:#f6f8fa;color:#656d76;padding:4px 7px;font-size:.71rem}
.task-body{padding:0 16px 16px 65px}
.task-body textarea{border:1px solid #d1d9e0;border-radius:6px;background:#fff;font-size:.82rem}
.task-body textarea:focus{outline:2px solid #0969da;border-color:#0969da}
.task-feedback,.question-feedback{border-radius:6px}
.task-feedback.good,.question-feedback.good{background:#dafbe1;color:#116329;border:1px solid #aceebb}
.task-feedback.bad,.question-feedback.bad{background:#ffebe9;color:#a40e26;border:1px solid #ffcecb}
.answer-grid{gap:7px}
.answer-option{border:1px solid #d1d9e0;border-radius:6px;padding:10px 12px;font-size:.9rem}
.answer-option:hover{border-color:#0969da;background:#f6f8fa}
.answer-option .option-letter{background:#f6f8fa;border:1px solid #d1d9e0;border-radius:5px}
.answer-option.chosen{border-color:#0969da;background:#ddf4ff}
.answer-option.correct{border-color:#1a7f37;background:#dafbe1}
.answer-option.incorrect{border-color:#cf222e;background:#ffebe9}
.question-card,.chapter-card,.lesson-article,.lesson-aside,.glossary-item{border:1px solid #d1d9e0;border-radius:7px;box-shadow:none}
.question-card{padding:16px;margin:10px 0}
.question-card h3{font-size:.98rem;letter-spacing:-.01em;line-height:1.55}
.question-meta{font-size:.68rem;letter-spacing:.035em;color:#656d76}
.chapter-card{padding:18px;margin:12px 0;grid-template-columns:42px 1fr;gap:13px}
.chapter-icon{width:38px;height:38px;border:1px solid #d1d9e0;border-radius:6px;background:#f6f8fa;font-size:1rem}
.chapter-content h2{font-size:1.15rem;letter-spacing:-.02em}
.chapter-summary{font-size:.87rem}
.chapter-content .lesson-body{line-height:1.7;font-size:.93rem}
.lesson-layout{grid-template-columns:1fr 250px;gap:14px}
.lesson-article,.lesson-aside{padding:20px}
.lesson-aside{top:82px}
.lesson-nav{gap:5px}
.lesson-nav button{border-radius:5px;border:1px solid #d1d9e0;background:#fff;font-size:.8rem;padding:8px 9px;font-weight:600}
.lesson-nav button.active{background:#ddf4ff;border-color:#0969da;color:#0550ae}
.pill-row span{background:#f6f8fa;border:1px solid #d1d9e0;border-radius:5px;color:#656d76;padding:5px 8px;font-weight:600}
.search-input{border:1px solid #d1d9e0;border-radius:6px;padding:9px 11px}
.glossary-item{padding:14px}
.glossary-item h3{font-size:.91rem}
.glossary-item pre{background:#f6f8fa;border:1px solid #d1d9e0;border-radius:5px}
.filter-row button{border-radius:5px;border-color:#d1d9e0;font-weight:600}
.filter-row button.active{background:#1f2328;color:#fff;border-color:#1f2328}
.progress-inline,.progress-line,.module-progress{border-radius:3px;background:#d8dee4}
.progress-inline span,.progress-line span,.module-progress span{background:#0969da}
.footer{background:#f6f8fa;border-top:1px solid #d1d9e0;padding:16px 0 22px;font-size:.8rem}
.footer button{color:#0969da}
.toast{border:1px solid #30363d;border-radius:6px;background:#1f2328;box-shadow:0 8px 24px rgba(31,35,40,.22);font-weight:600}
/* Navigation latérale du parcours. */
.learning-layout{display:grid;grid-template-columns:238px minmax(0,1fr);gap:24px;align-items:start}
.learning-content{min-width:0}
.path-sidebar{position:sticky;top:82px;max-height:calc(100vh - 98px);overflow:auto;border:1px solid #d1d9e0;border-radius:7px;background:#fff;padding:0 0 12px}
.path-sidebar-head{padding:16px 14px 13px;border-bottom:1px solid #d1d9e0;background:#f6f8fa}
.path-sidebar-label{font-size:.66rem;letter-spacing:.08em;color:#656d76;font-weight:750;margin-bottom:5px}
.path-sidebar-head h2{font-size:1rem;line-height:1.35;letter-spacing:-.015em;margin:0 0 5px}
.path-sidebar-head p{font-size:.78rem;color:#656d76;margin:0}
.path-sidebar-progress{height:4px;background:#d8dee4;margin-top:11px;border-radius:3px;overflow:hidden}
.path-sidebar-progress span{display:block;height:100%;background:#0969da}
.path-sidebar-group{padding:12px 9px 4px}
.path-sidebar-group-title{padding:0 7px 6px;font-size:.65rem;font-weight:750;color:#656d76;letter-spacing:.06em;text-transform:uppercase}

<body>
<header class="topbar"><div class="shell topbar-inner">
  <button class="brand" type="button" onclick="goHome()" aria-label="Accueil Revise"><span class="brand-mark" aria-hidden="true">R</span><span class="brand-wording"><span>Revise<span class="brand-period">.</span></span><small>PARCOURS DE RÉVISION</small></span></button>
  <nav class="nav" aria-label="Navigation principale"><button id="nav-home" onclick="goHome()" class="active">Accueil</button><button id="nav-sql" onclick="goSQL()">Bases de données</button><button id="nav-business" onclick="goBusiness()">Entreprise</button></nav>

</div></header>
<main id="app" class="shell page" tabindex="-1"></main>
<footer class="footer"><div class="shell footer-inner"><div><strong>Revise.</strong> — Réviser. Pratiquer. Maîtriser. <span class="developer-credit">Developed by djochristk</span></div><div>La progression est sauvegardée sur cet appareil. <button onclick="resetProgress()">Réinitialiser la progression</button></div></div></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const STORE_KEY='maitriseRevision.v1';
const defaultState=()=>({points:0,earnedTasks:{},completedTasks:{},drafts:{},mcqAnswers:{},earnedMcq:{},seenLessons:{},bestScores:{}});
let state=loadState();
function loadState(){
 try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(STORE_KEY)||'{}'));}catch(e){}
 try{const m=document.cookie.match(/(?:^|; )maitriseRevision=([^;]+)/);if(m)return Object.assign(defaultState(),JSON.parse(decodeURIComponent(m[1])));}catch(e){}
 return defaultState();
}
function persistState(){
 const raw=JSON.stringify(state);
 try{localStorage.setItem(STORE_KEY,raw);return true;}catch(e){}
 // First-party cookie fallback for static hosting where localStorage is unavailable.
 try{if(raw.length<3600){document.cookie='maitriseRevision='+encodeURIComponent(raw)+'; Max-Age=31536000; Path=/; SameSite=Lax';return document.cookie.includes('maitriseRevision=');}}catch(e){}
 return false;
}
function saveState(){if(!persistState())showToast('La sauvegarde locale est indisponible dans ce navigateur.');updateScore();}
function updateScore(){const s=document.getElementById('top-score');if(s)s.textContent=state.points;const ring=document.querySelector('.progress-ring');if(ring){const total=allTrackedIds().length;const done=countCompleted();ring.style.setProperty('--progress',`${total?Math.round(done/total*100):0}%`);const n=ring.querySelector('strong');if(n)n.innerHTML=`${total?Math.round(done/total*100):0}%<small>acquis</small>`;}const p=document.getElementById('home-points');if(p)p.textContent=state.points;}
function showToast(message){const t=document.getElementById('toast');if(!t)return;t.textContent=message;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
function setActiveNav(which){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const e=document.getElementById('nav-'+which);if(e)e.classList.add('active');}
function goHome(){renderHome();setActiveNav('home');window.scrollTo({top:0,behavior:'smooth'});}
function goSQL(){renderSQL();setActiveNav('sql');window.scrollTo({top:0,behavior:'smooth'});}
function goBusiness(){renderBusiness();setActiveNav('business');window.scrollTo({top:0,behavior:'smooth'});}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function codeBox(code,label='Exemple Oracle'){const id='code-'+Math.random().toString(36).slice(2,9);return `<div class="code-box"><div class="code-head"><span>${label}</span><button type="button" onclick="copyCode('${id}')">Copier le code</button></div><pre id="${id}">${esc(code)}</pre></div>`;}
function pageIntro(eyebrow,title,desc,sideBig,sideSmall){return `<section class="page-intro"><div><div class="eyebrow"><span class="eyebrow-dot"></span>${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${sideBig?`<div class="intro-side"><strong>${sideBig}</strong><span>${sideSmall||''}</span></div>`:''}</section>`;}
function renderHome(){
 document.getElementById('app').innerHTML=`
 <section class="hero"><div class="hero-main"><div class="hero-copy"><div class="eyebrow"><span class="eyebrow-dot"></span>PARCOURS DE RÉVISION</div><h1>Apprendre.<br><em>Pratiquer.</em><br>Maîtriser.</h1><p>Deux matières, des parcours guidés et des défis progressifs pour transformer les notions de cours en réflexes le jour de l’épreuve.</p><button class="primary-btn" onclick="goSQL()">Commencer à réviser <span>↗</span></button></div><div class="hero-art" aria-hidden="true"><span>R.</span></div></div>
 <aside class="progress-card"><div><div class="kicker">Ton parcours</div><h2>Chaque bonne réponse compte.</h2><p>Les points et les activités acquises restent enregistrés dans ce navigateur.</p></div><div class="progress-ring"><strong>0%<small>acquis</small></strong></div><div class="stat-row"><div class="stat"><strong id="home-points">${state.points}</strong><span>POINTS GAGNÉS</span></div><div class="stat"><strong>${countCompleted()}</strong><span>ACTIVITÉS VALIDÉES</span></div></div></aside></section>
 <div class="section-head"><div><div class="kicker">Choisir un parcours</div><h2>Choisir un parcours de révision</h2></div><p>Chaque parcours combine des explications, des exercices et des corrections commentées.</p></div>
 <section class="course-grid"><article class="course-card sql"><div class="course-top"><div class="course-icon">⌘</div><span class="label">Parcours technique</span></div><h3>Bases de données</h3><p>Algèbre relationnelle, assertions oui/non et QCM SQL fondés sur des exemples concrets, avec corrections détaillées.</p><div class="course-footer"><div class="course-meta"><span>Algèbre relationnelle</span><span>QCM contextualisés</span></div><button class="arrow-btn" aria-label="Ouvrir le cours Bases de données" onclick="goSQL()">↗</button></div></article>
 <article class="course-card business"><div class="course-top"><div class="course-icon">↗</div><span class="label">Parcours de gestion</span></div><h3>Création & gestion d’entreprise</h3><p>Comprends l’entreprise comme système, son organisation, ses activités commerciales, ses moyens de financement et les étapes de création.</p><div class="course-footer"><div class="course-meta"><span>5 chapitres développés</span><span>QCM corrigés</span></div><button class="arrow-btn" aria-label="Ouvrir le cours de gestion" onclick="goBusiness()">↗</button></div></article></section>
 <section class="feature-strip"><div class="feature"><div class="feature-icon">◎</div><div><b>Révisions actives</b><span>Rappels courts avant de passer à l’application.</span></div></div><div class="feature"><div class="feature-icon">✦</div><div><b>Points & progression</b><span>Des points pour les bonnes réponses et les tâches réussies.</span></div></div><div class="feature"><div class="feature-icon">↻</div><div><b>À ton rythme</b><span>Reprends où tu t’es arrêté, sur le même appareil.</span></div></div></section>`;
 updateScore();
}


const relationalQuestions=[
{id:'ra01',topic:'Algèbre relationnelle · sélection',points:3,text:'On considère ARTICLE(NUMART, NOMART, CODECAT, UNITECONS). On veut garder uniquement les tuples dont UNITECONS = « pièce », sans modifier les colonnes affichées. Quelle expression convient ?',options:['πUNITECONS(ARTICLE)','σUNITECONS=\'pièce\'(ARTICLE)','πNOMART(σUNITECONS=\'pièce\'(ARTICLE))','ARTICLE × CATEGORIE'],correct:1,explanation:'La sélection σ filtre les tuples selon un prédicat et conserve les attributs de la relation. La projection π choisirait des colonnes.'},
{id:'ra02',topic:'Algèbre relationnelle · projection',points:3,text:'Une relation ARTICLE contient plusieurs lignes avec le même NOMART. Dans l’algèbre relationnelle classique ensembliste, quel résultat donne πNOMART(ARTICLE) ?',options:['Tous les noms répétés autant de fois que dans la table','Les noms distincts uniquement','Uniquement le premier nom','Les lignes sans valeur NULL uniquement'],correct:1,explanation:'Les relations de l’algèbre relationnelle classique sont des ensembles : la projection élimine les doublons du résultat.'},
{id:'ra03',topic:'Algèbre relationnelle · union',points:3,text:'R possède les attributs (CODE, NOM) et S les attributs (ID, LIBELLE), chacun avec deux colonnes de types compatibles. Peut-on faire R ∪ S ?',options:['Non, les noms des attributs doivent toujours être identiques','Oui, si les relations sont compatibles en degré et en types correspondants','Oui uniquement si les deux relations ont les mêmes tuples','Non, une union exige une clé étrangère'],correct:1,explanation:'L’union exige des relations union-compatibles : même nombre d’attributs et domaines/types compatibles dans les positions correspondantes. Les noms peuvent différer selon la notation adoptée.'},
{id:'ra04',topic:'Algèbre relationnelle · différence',points:3,text:'R contient les codes des magasins enregistrés. S contient les codes des magasins ayant au moins une vente. Que représente R − S ?',options:['Les magasins qui ont au moins une vente','Les magasins enregistrés sans vente correspondante','Tous les couples magasin-article','Les magasins communs à R et S'],correct:1,explanation:'La différence conserve les tuples présents dans la première relation et absents de la seconde. Les schémas doivent être compatibles.'},
{id:'ra05',topic:'Algèbre relationnelle · jointure',points:3,text:'Pour associer chaque ARTICLE à sa catégorie, quelle opération et quelle condition sont adaptées ?',options:['ARTICLE × CATEGORIE sans condition','ARTICLE ⋈ ARTICLE.NUMART = CATEGORIE.CODECAT CATEGORIE','ARTICLE ⋈ ARTICLE.CODECAT = CATEGORIE.CODECAT CATEGORIE','ARTICLE − CATEGORIE'],correct:2,explanation:'La jointure relie les lignes dont les clés correspondantes sont égales : ARTICLE.CODECAT et CATEGORIE.CODECAT.'},
{id:'ra06',topic:'Algèbre relationnelle · produit cartésien',points:3,text:'ARTICLE contient 12 tuples et MAGASIN en contient 4. En l’absence de condition, combien de tuples contient ARTICLE × MAGASIN ?',options:['16','48','12','4'],correct:1,explanation:'Le produit cartésien produit toutes les combinaisons : 12 × 4 = 48 tuples, avant tout filtrage éventuel.'},
{id:'ra07',topic:'Algèbre relationnelle · ordre des opérations',points:3,text:'On veut afficher les noms distincts des articles enregistrés dans les ventes. Quelle expression traduit le plus précisément la démarche ?',options:['πNOMART(VENTE ⋈ VENTE.NUMART=ARTICLE.NUMART ARTICLE)','σNOMART(πNUMMAG(ARTICLE))','VENTE ∪ ARTICLE','πNOMART(VENTE − ARTICLE)'],correct:0,explanation:'On joint VENTE à ARTICLE par NUMART, puis on projette NOMART. En algèbre ensembliste, la projection élimine les doublons.'},
{id:'ra08',topic:'Algèbre relationnelle · renommage',points:3,text:'Pourquoi l’opérateur de renommage ρ peut-il être utile avant une auto-jointure de ARTICLE ?',options:['Il calcule la somme des prix','Il permet de distinguer deux occurrences de la même relation dans une expression','Il supprime les clés primaires','Il transforme une relation en table physique'],correct:1,explanation:'Le renommage attribue des noms distincts à deux occurrences d’une même relation, afin de qualifier les attributs sans ambiguïté.'},
{id:'ra09',topic:'Algèbre relationnelle · division',points:3,text:'Une requête demande les étudiants ayant réussi tous les cours obligatoires listés dans une relation COURS_OBLIGATOIRES. Quel opérateur relationnel est classiquement adapté à la condition « tous » ?',options:['Produit cartésien uniquement','Division relationnelle','Différence symétrique','Projection seule'],correct:1,explanation:'La division relationnelle permet de rechercher les éléments associés à tous les éléments d’une autre relation.'},
{id:'ra10',topic:'Algèbre relationnelle · filtrer avant projeter',points:3,text:'Dans σPRIXART>5000(πNOMART,PRIXART(ARTICLE)), pourquoi cette expression est-elle possible ?',options:['Parce que PRIXART reste présent après la projection','Parce que σ peut toujours utiliser n’importe quel attribut d’origine','Parce que π crée automatiquement PRIXART','Parce que les deux opérations sont synonymes'],correct:0,explanation:'La sélection extérieure peut tester PRIXART parce que cet attribut a été conservé par la projection intérieure.'},
{id:'ra11',topic:'Algèbre relationnelle · attribut manquant',points:3,text:'On écrit σPRIXART>5000(πNOMART(ARTICLE)). Quel est le problème ?',options:['Aucun, la projection ajoute les prix automatiquement','PRIXART n’est plus disponible dans la relation projetée','σ interdit les comparaisons numériques','ARTICLE ne peut pas être projetée'],correct:1,explanation:'Après πNOMART(ARTICLE), PRIXART a disparu du schéma du résultat. On ne peut donc plus l’utiliser dans une sélection extérieure.'},
{id:'ra12',topic:'Algèbre relationnelle · cardinalité',points:3,text:'Un magasin correspond à 8 lignes VENTE. Une jointure de MAGASIN avec VENTE sur NUMMAG donnera combien de lignes pour ce magasin ?',options:['Toujours une seule ligne, car NUMMAG est une clé de MAGASIN','Huit lignes si les huit ventes correspondent','Zéro ligne obligatoirement','Une ligne par colonne de MAGASIN'],correct:1,explanation:'Une jointure un-à-plusieurs répète les attributs du magasin pour chaque vente correspondante. Une clé du côté parent n’empêche pas plusieurs lignes côté enfant.'},
{id:'ra13',topic:'Algèbre relationnelle · magasins sans ventes',points:3,text:'MAGASIN(NUMMAG,NOMMAG) et VENTE(NUMMAG,DATEV,NUMART,QTEV) sont disponibles. Quelle expression identifie les numéros des magasins sans vente ?',options:['πNUMMAG(MAGASIN) − πNUMMAG(VENTE)','πNOMMAG(VENTE) − πNUMMAG(MAGASIN)','MAGASIN × VENTE','πNUMMAG(MAGASIN) ∪ πNUMMAG(VENTE)'],correct:0,explanation:'Les numéros de tous les magasins sont soustraits des numéros présents dans VENTE. Les deux projections donnent des relations à un attribut compatibles.'},
{id:'ra14',topic:'Algèbre relationnelle · ordre et résultat',points:3,text:'On compare πNOMART(σUNITECONS=\'pièce\'(ARTICLE)) et σUNITECONS=\'pièce\'(πNOMART(ARTICLE)). Pourquoi la seconde expression est-elle incorrecte ?',options:['Elle projette trop de colonnes','UNITECONS n’existe plus après πNOMART','σ doit toujours précéder le produit cartésien','La projection ne peut jamais être combinée à une sélection'],correct:1,explanation:'La projection intérieure ne conserve que NOMART : UNITECONS est absent et ne peut plus servir de prédicat.'},
{id:'ra15',topic:'Algèbre relationnelle · agrégation',points:3,text:'Dans les extensions de l’algèbre relationnelle utilisées pour les requêtes analytiques, quelle opération permet de calculer la somme des quantités par magasin ?',options:['Une agrégation avec regroupement par NUMMAG','Une projection simple sur QTEV','Une différence entre MAGASIN et VENTE','Un renommage de QTEV'],correct:0,explanation:'L’algèbre relationnelle de base n’inclut pas toujours les agrégats ; les extensions ajoutent des opérateurs de regroupement et SUM(QTEV) par NUMMAG.'},
{id:'ra16',topic:'Algèbre relationnelle · jointure et sélection',points:3,text:'On veut les noms des catégories possédant au moins un article dont l’unité est « pièce ». Quelle stratégie évite de produire des combinaisons sans lien ?',options:['Faire une jointure sur CODECAT, sélectionner UNITECONS=\'pièce\', puis projeter NOMCAT','Faire CATEGORIE × ARTICLE, puis projeter NOMCAT sans condition','Soustraire ARTICLE de CATEGORIE directement','Projeter NOMCAT à partir de VENTE seule'],correct:0,explanation:'La jointure sur CODECAT respecte le lien entre les tables. La sélection filtre les articles voulus, puis la projection garde les noms de catégories.'},
{id:'ra17',topic:'Algèbre relationnelle · relation vide',points:3,text:'Si aucun article n’utilise l’unité « kilogramme », que vaut σUNITECONS=\'kilogramme\'(ARTICLE) ?',options:['La relation ARTICLE complète','Une relation vide ayant le schéma projeté de ARTICLE','Une erreur automatique','Un tuple contenant NULL pour chaque colonne'],correct:1,explanation:'Une sélection sans tuple satisfaisant le prédicat renvoie une relation vide, mais son schéma reste celui de la relation d’entrée.'},
{id:'ra18',topic:'Algèbre relationnelle · jointure naturelle',points:3,text:'Quel risque faut-il connaître avec une jointure naturelle entre deux relations ?',options:['Elle invente des colonnes absentes','Elle joint automatiquement sur tous les attributs portant le même nom, ce qui peut imposer des égalités non souhaitées','Elle ne peut fonctionner qu’avec des nombres','Elle supprime forcément toutes les lignes'],correct:1,explanation:'NATURAL JOIN utilise automatiquement tous les noms d’attribut communs. Une colonne homonyme non destinée à établir le lien peut donc changer le résultat.'}
];
const relationalAssertions=[
{id:'rat01',topic:'Assertion · Oui ou non',points:2,text:'Assertion : la sélection σ réduit le nombre de tuples ou le laisse identique ; elle ne choisit pas à elle seule un sous-ensemble de colonnes.',options:['Oui','Non'],correct:0,explanation:'Oui. σ filtre les tuples selon un prédicat. π sert à choisir les attributs.'},
{id:'rat02',topic:'Assertion · Oui ou non',points:2,text:'Assertion : une projection πNOMART(ARTICLE) conserve automatiquement les valeurs de CODECAT et UNITECONS, même si elles ne figurent pas dans la projection.',options:['Oui','Non'],correct:1,explanation:'Non. Les attributs non projetés ne font pas partie du schéma résultat.'},
{id:'rat03',topic:'Assertion · Oui ou non',points:2,text:'Assertion : dans l’algèbre relationnelle classique ensembliste, une projection ne renvoie pas plusieurs copies d’un même tuple résultat.',options:['Oui','Non'],correct:0,explanation:'Oui. Les relations sont traitées comme des ensembles, donc les doublons sont éliminés.'},
{id:'rat04',topic:'Assertion · Oui ou non',points:2,text:'Assertion : pour calculer R ∪ S, il suffit que R et S aient une clé étrangère commune ; le nombre et les types de leurs attributs n’importent pas.',options:['Oui','Non'],correct:1,explanation:'Non. L’union exige des relations compatibles en nombre d’attributs et en domaines/types correspondants.'},
{id:'rat05',topic:'Assertion · Oui ou non',points:2,text:'Assertion : le produit cartésien de deux relations de 5 et 6 tuples comporte 30 tuples avant sélection.',options:['Oui','Non'],correct:0,explanation:'Oui. La cardinalité du produit est le produit des cardinalités : 5 × 6 = 30.'},
{id:'rat06',topic:'Assertion · Oui ou non',points:2,text:'Assertion : une jointure sur une relation parent dont la clé est unique peut quand même produire plusieurs lignes par parent si plusieurs lignes enfant lui correspondent.',options:['Oui','Non'],correct:0,explanation:'Oui. L’unicité de la clé parent n’empêche pas une relation un-à-plusieurs.'},
{id:'rat07',topic:'Assertion · Oui ou non',points:2,text:'Assertion : R − S signifie les tuples de S qui ne figurent pas dans R.',options:['Oui','Non'],correct:1,explanation:'Non. R − S garde les tuples de R absents de S ; l’ordre est important.'},
{id:'rat08',topic:'Assertion · Oui ou non',points:2,text:'Assertion : si on sélectionne sur UNITECONS après avoir projeté uniquement NOMART, l’expression ne dispose plus de UNITECONS.',options:['Oui','Non'],correct:0,explanation:'Oui. Une opération extérieure ne peut utiliser que les attributs présents dans sa relation d’entrée.'},

{id:'rat10',topic:'Assertion · Oui ou non',points:2,text:'Assertion : une jointure naturelle est toujours sans risque dès que les noms des colonnes sont identiques.',options:['Oui','Non'],correct:1,explanation:'Non. Elle joint sur tous les attributs de même nom ; cela peut ajouter des conditions involontaires.'},
{id:'rat11',topic:'Assertion · Oui ou non',points:2,text:'Assertion : dans une expression de l’algèbre relationnelle, on peut soustraire directement CATEGORIE à ARTICLE même si leurs schémas sont différents.',options:['Oui','Non'],correct:1,explanation:'Non. La différence s’applique à des relations compatibles.'},
{id:'rat12',topic:'Assertion · Oui ou non',points:2,text:'Assertion : une sélection dont le prédicat n’est satisfait par aucun tuple produit une relation vide, pas une relation remplie de NULL.',options:['Oui','Non'],correct:0,explanation:'Oui. Aucun tuple ne satisfait le prédicat ; le schéma est conservé mais le résultat ne contient aucune ligne.'}
